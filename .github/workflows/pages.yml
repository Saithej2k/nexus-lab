name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; queued runs supersede rather than race.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # This repo is mirrored to a host that owns its own copy; only the canonical
    # one publishes Pages, so the mirror never shows a failing deploy.
    if: github.repository == 'Saithej2k/nexus-lab'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run lint

      - name: Build
        # A project page lives under /<repo>/, so the asset base must match.
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
        run: npm run build

      - name: Add SPA fallback
        # Pages serves 404.html for unknown paths; handing it the app keeps
        # deep links working instead of showing GitHub's error page.
        run: cp dist/index.html dist/404.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    if: github.repository == 'Saithej2k/nexus-lab'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
